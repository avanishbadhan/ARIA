<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary: #00f0ff;
      --primary-glow: rgba(0, 240, 255, 0.4);
      --bg-dark: #050914;
      --panel-bg: rgba(10, 16, 30, 0.95);
      --border-color: rgba(0, 243, 255, 0.25);
      --text-main: #e8eefc;
      --text-dim: #8b98b8;
      --font-mono: 'Consolas', 'Courier New', monospace;
      --font-main: 'Segoe UI', 'Inter', sans-serif;
      --red-alert: #ff3366;
      /* Matches BrowserWindow size in main.cjs (BAR_W x BAR_H) */
      --bar-w: 460px;
      --bar-h: 64px;
      --exp-h: 380px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: var(--font-main);
      color: var(--text-main);
      user-select: none;
      -webkit-user-select: none;
    }

    .widget {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow:
        0 0 24px rgba(0, 240, 255, 0.12),
        0 4px 18px rgba(0, 0, 0, 0.5);
    }

    /* ===== Top Bar: logo + input + actions ===== */
    .bar {
      height: var(--bar-h);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px 0 6px;
      background: var(--panel-bg);
      -webkit-app-region: drag;   /* drag the widget by the bar */
      cursor: grab;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      padding: 6px 10px 6px 4px;
      border-radius: 10px;
      cursor: pointer;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }

    .logo:hover {
      background: rgba(0, 240, 255, 0.08);
    }

    .logo img {
      height: 30px;
      width: auto;
      filter: drop-shadow(0 0 7px var(--primary-glow));
      pointer-events: none;
    }

    .input-field {
      flex: 1;
      min-width: 0;
      background: rgba(13, 22, 41, 0.6);
      border: 1px solid rgba(148, 184, 255, 0.14);
      border-radius: 9px;
      padding: 9px 12px;
      color: var(--text-main);
      font-family: var(--font-main);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      -webkit-app-region: no-drag;
      pointer-events: auto;
    }

    .input-field::placeholder {
      color: var(--text-dim);
      opacity: 0.6;
    }

    .input-field:focus {
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.1);
    }

    .btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.18);
      background: rgba(0, 240, 255, 0.05);
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      -webkit-app-region: no-drag;
      pointer-events: auto;
      flex-shrink: 0;
      font-size: 15px;
      font-family: var(--font-mono);
    }

    .btn:hover {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
    }

    .btn:active {
      transform: scale(0.94);
    }

    .btn.close:hover {
      border-color: rgba(255, 51, 102, 0.4);
      background: rgba(255, 51, 102, 0.12);
      color: var(--red-alert);
      box-shadow: none;
    }

    .btn svg {
      width: 14px;
      height: 14px;
    }

    /* ===== Chat Panel (below the bar) ===== */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(7, 12, 24, 0.97);
      border-top: 1px solid rgba(0, 240, 255, 0.12);
      padding: 10px;
      /* Panel content is clipped while the window is bar-sized */
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .widget.expanded .chat {
      visibility: visible;
      opacity: 1;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: thin;
    }

    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.18); border-radius: 2px; }

    .chat-msg {
      max-width: 92%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      line-height: 1.45;
      word-wrap: break-word;
      user-select: text;
      -webkit-user-select: text;
      animation: msg-enter 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes msg-enter {
      0% { opacity: 0; transform: translateY(5px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .chat-msg.user {
      align-self: flex-end;
      background: rgba(0, 240, 255, 0.07);
      border: 1px solid rgba(0, 240, 255, 0.18);
      border-bottom-right-radius: 3px;
    }

    .chat-msg.aria {
      align-self: flex-start;
      background: rgba(13, 22, 41, 0.6);
      border: 1px solid rgba(148, 184, 255, 0.12);
      border-bottom-left-radius: 3px;
    }

    .chat-msg .sender {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 3px;
      color: var(--text-dim);
    }

    .chat-msg.aria .sender { color: var(--primary); }

    .chat-msg.thinking {
      align-self: flex-start;
      background: rgba(13, 22, 41, 0.5);
      border: 1px solid rgba(148, 184, 255, 0.08);
      color: var(--text-dim);
      font-style: italic;
      font-size: 11.5px;
      border-bottom-left-radius: 3px;
    }

    .dots {
      display: inline-flex;
      gap: 2px;
      margin-left: 4px;
    }

    .dots span {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--primary);
      animation: thinking-dot 1.2s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes thinking-dot {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="widget" id="widget">
    <!-- Bar: logo + input + send + close -->
    <div class="bar" id="widgetBar">
      <div class="logo" id="logoBtn" title="Toggle conversation panel">
        <img src="assets/aria-logo.svg" alt="ARIA" draggable="false" />
      </div>
      <input type="text" class="input-field" id="inputField" placeholder="Ask ARIA anything..." autocomplete="off" />
      <button class="btn" id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
      <button class="btn close" id="closeBtn" title="Close overlay">&times;</button>
    </div>

    <!-- Resquest / response panel -->
    <div class="chat">
      <div class="chat-messages" id="chatMessages"></div>
    </div>
  </div>

  <script>
    (async () => {
      const ipc = window.jarvisElectron;
      const widget = document.getElementById('widget');
      const logoBtn = document.getElementById('logoBtn');
      const inputField = document.getElementById('inputField');
      const sendBtn = document.getElementById('sendBtn');
      const closeBtn = document.getElementById('closeBtn');
      const chatMessages = document.getElementById('chatMessages');

      if (!ipc || !ipc.overlay) {
        console.error('[OVERLAY RENDERER] window.jarvisElectron.overlay bridge not available');
        return;
      }

      const BAR_W = 460, BAR_H = 64, EXP_H = 380;
      let expanded = false;
      // In-flight response bookkeeping — if ARIA never answers (e.g. the main
      // window was reloaded/restarting mid-request), the "Processing..." row
      // must not hang forever.
      let pendingTimer = null;

      function setExpanded(next) {
        expanded = next;
        widget.classList.toggle('expanded', expanded);
        const h = expanded ? EXP_H : BAR_H;
        ipc.overlay.setSize(BAR_W, h).catch(() => {});
      }

      function addMessage(text, sender) {
        const msg = document.createElement('div');
        msg.className = 'chat-msg ' + sender;
        if (sender === 'thinking') {
          msg.innerHTML = '<div class="text">Processing<span class="dots"><span></span><span></span><span></span></span></div>';
        } else {
          const label = sender === 'aria' ? 'ARIA' : 'You';
          msg.innerHTML = '<div class="sender">' + label + '</div><div class="text"></div>';
          msg.querySelector('.text').textContent = text;
        }
        chatMessages.appendChild(msg);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return msg;
      }

      // ---- Control wiring FIRST. Every interactive element gets its handler
      // before any await, so a failure later in boot can never leave the
      // widget dead (the close button must always work). ----

      closeBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        try { await ipc.screen.overlayToggle(false); } catch (err) { /* noop */ }
      });

      logoBtn.addEventListener('click', () => setExpanded(!expanded));

      inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Escape: collapse the conversation panel, or hide the widget entirely
      // when already collapsed.
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (expanded) {
          setExpanded(false);
        } else {
          ipc.screen.overlayToggle(false).catch(() => {});
        }
      });

      async function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;
        inputField.value = '';
        if (!expanded) setExpanded(true);
        addMessage(text, 'user');
        addMessage('', 'thinking');
        clearTimeout(pendingTimer);
        pendingTimer = setTimeout(() => {
          const t = chatMessages.querySelector('.chat-msg.thinking');
          if (t) {
            t.remove();
            addMessage('No response from ARIA — the main window may still be loading. Try sending that again.', 'aria');
          }
        }, 60000);
        try {
          await ipc.overlay.sendMessage(text);
        } catch (e) {
          clearTimeout(pendingTimer);
          const t = chatMessages.querySelector('.chat-msg.thinking');
          if (t) t.remove();
          addMessage('Error: ' + (e && e.message ? e.message : 'send failed'), 'aria');
        }
      }

      sendBtn.addEventListener('click', sendMessage);

      // ---- Response channel + boot acks (safe to fail without killing UI) ----

      // Response from ARIA (routed through main.cjs from the main pipeline)
      ipc.overlay.onResponse((data) => {
        clearTimeout(pendingTimer);
        pendingTimer = null;
        const thinkingMsg = chatMessages.querySelector('.chat-msg.thinking');
        if (thinkingMsg) thinkingMsg.remove();
        if (data && data.text) {
          addMessage(data.text, 'aria');
          if (!expanded) setExpanded(true); // surface the answer even if collapsed
        }
      });

      // Acknowledge readiness (breaks the old auto-show loop)
      if (ipc.overlay.toggleReady) {
        await ipc.overlay.toggleReady().catch(() => {});
      }
    })();
  </script>
</body>
</html>
