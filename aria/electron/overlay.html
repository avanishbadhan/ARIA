<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00f0ff;
      --primary-glow: rgba(0, 240, 255, 0.4);
      --bg-dark: #050914;
      --panel-bg: rgba(13, 22, 41, 0.85);
      --panel-solid: #0d1629;
      --border-color: rgba(148, 184, 255, 0.14);
      --border-cyan: rgba(0, 243, 255, 0.3);
      --text-main: #e8eefc;
      --text-dim: #8b98b8;
      --font-mono: 'Roboto Mono', 'Consolas', monospace;
      --font-main: 'Segoe UI', 'Inter', 'Roboto', sans-serif;
      --radius: 18px;
      --green-ok: #34d399;
      --gold-glow: #ffaa00;
      --red-alert: #ff3366;
      --accent-pink: #ff007f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: var(--font-main);
      color: var(--text-main);
      pointer-events: none;
    }

    /* ===== Overlay Container ===== */
    .overlay-container {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 420px;
      max-width: 90vw;
      height: 520px;
      max-height: 80vh;
      background: linear-gradient(135deg, rgba(13, 22, 41, 0.9) 0%, rgba(5, 9, 20, 0.95) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 243, 255, 0.25);
      border-radius: var(--radius);
      padding: 0;
      overflow: hidden;
      box-shadow:
        0 0 40px rgba(0, 240, 255, 0.1),
        0 8px 40px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(148, 184, 255, 0.08);
      z-index: 2147483647;
      line-height: 1.5;
      pointer-events: auto;
      opacity: 0;
      transform: translateY(-12px) scale(0.97);
      animation: overlay-enter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      display: flex;
      flex-direction: column;
    }

    @keyframes overlay-enter {
      0% { opacity: 0; transform: translateY(-12px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== Animated Border Glow ===== */
    .overlay-container::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(
        135deg,
        rgba(0, 240, 255, 0.4) 0%,
        rgba(0, 240, 255, 0.05) 25%,
        rgba(255, 170, 0, 0.15) 50%,
        rgba(0, 240, 255, 0.05) 75%,
        rgba(0, 240, 255, 0.4) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      animation: border-shimmer 4s linear infinite;
      z-index: 1;
    }

    @keyframes border-shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== Header (Draggable) ===== */
    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px 12px;
      border-bottom: 1px solid rgba(148, 184, 255, 0.12);
      position: relative;
      -webkit-app-region: drag;
      cursor: move;
      flex-shrink: 0;
      z-index: 2;
    }

    .overlay-header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 20px;
      right: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.5), transparent);
    }

    .overlay-title {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .overlay-title::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary-glow);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    .overlay-close {
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dim);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid rgba(148, 184, 255, 0.1);
      background: rgba(13, 22, 41, 0.5);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: auto;
      -webkit-app-region: no-drag;
    }

    .overlay-close:hover {
      color: var(--red-alert);
      border-color: rgba(255, 51, 102, 0.4);
      background: rgba(255, 51, 102, 0.1);
      box-shadow: 0 0 12px rgba(255, 51, 102, 0.2);
      transform: scale(1.05);
    }

    .overlay-close:active {
      transform: scale(0.95);
    }

    /* ===== Chat Area ===== */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0 16px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 240, 255, 0.2) transparent;
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.2);
      border-radius: 2px;
    }

    .chat-msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
      animation: msg-enter 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes msg-enter {
      0% { opacity: 0; transform: translateY(8px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .chat-msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.15) 0%, rgba(0, 240, 255, 0.08) 100%);
      border: 1px solid rgba(0, 240, 255, 0.2);
      color: var(--text-main);
      border-bottom-right-radius: 4px;
    }

    .chat-msg.aria {
      align-self: flex-start;
      background: linear-gradient(135deg, rgba(13, 22, 41, 0.6) 0%, rgba(5, 9, 20, 0.7) 100%);
      border: 1px solid rgba(148, 184, 255, 0.12);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    .chat-msg.aria .sender {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-msg.aria .sender::before {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 4px var(--primary-glow);
    }

    .chat-msg.user .sender {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
      text-align: right;
    }

    .chat-msg.thinking {
      align-self: flex-start;
      background: rgba(13, 22, 41, 0.4);
      border: 1px solid rgba(148, 184, 255, 0.08);
      color: var(--text-dim);
      font-style: italic;
      border-bottom-left-radius: 4px;
    }

    .chat-msg.thinking .dots {
      display: inline-flex;
      gap: 3px;
      margin-left: 4px;
    }

    .chat-msg.thinking .dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--primary);
      animation: thinking-dot 1.2s ease-in-out infinite;
    }

    .chat-msg.thinking .dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .chat-msg.thinking .dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes thinking-dot {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.5;
      gap: 8px;
    }

    .chat-empty .icon {
      font-size: 24px;
      opacity: 0.4;
      animation: scan-pulse 3s ease-in-out infinite;
    }

    @keyframes scan-pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    /* ===== Input Area ===== */
    .input-area {
      padding: 12px 16px 16px;
      border-top: 1px solid rgba(148, 184, 255, 0.08);
      flex-shrink: 0;
      background: rgba(5, 9, 20, 0.3);
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-field {
      flex: 1;
      background: rgba(13, 22, 41, 0.6);
      border: 1px solid rgba(148, 184, 255, 0.12);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-main);
      font-family: var(--font-main);
      font-size: 13px;
      outline: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: auto;
    }

    .input-field::placeholder {
      color: var(--text-dim);
      opacity: 0.6;
    }

    .input-field:focus {
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.1);
    }

    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid rgba(0, 240, 255, 0.2);
      background: rgba(0, 240, 255, 0.08);
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: auto;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
      transform: scale(1.05);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .send-btn svg {
      width: 16px;
      height: 16px;
    }

    /* ===== Status Bar ===== */
    .status-bar {
      padding: 6px 16px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.7;
      flex-shrink: 0;
    }

    .status-bar .dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--primary);
      margin-right: 4px;
      vertical-align: middle;
      box-shadow: 0 0 4px var(--primary-glow);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    .status-bar .status-text {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ===== Corner Brackets ===== */
    .corner-bracket {
      position: absolute;
      width: 12px;
      height: 12px;
      pointer-events: none;
      z-index: 3;
    }

    .corner-bracket::before,
    .corner-bracket::after {
      content: '';
      position: absolute;
      background: var(--primary);
      box-shadow: 0 0 4px var(--primary-glow);
    }

    .corner-bracket.tl { top: 6px; left: 6px; }
    .corner-bracket.tl::before { top: 0; left: 0; width: 12px; height: 1.5px; }
    .corner-bracket.tl::after { top: 0; left: 0; width: 1.5px; height: 12px; }

    .corner-bracket.tr { top: 6px; right: 6px; }
    .corner-bracket.tr::before { top: 0; right: 0; width: 12px; height: 1.5px; }
    .corner-bracket.tr::after { top: 0; right: 0; width: 1.5px; height: 12px; }

    .corner-bracket.bl { bottom: 6px; left: 6px; }
    .corner-bracket.bl::before { bottom: 0; left: 0; width: 12px; height: 1.5px; }
    .corner-bracket.bl::after { bottom: 0; left: 0; width: 1.5px; height: 12px; }

    .corner-bracket.br { bottom: 6px; right: 6px; }
    .corner-bracket.br::before { bottom: 0; right: 0; width: 12px; height: 1.5px; }
    .corner-bracket.br::after { bottom: 0; right: 0; width: 1.5px; height: 12px; }

    /* ===== Scan Line ===== */
    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.4), transparent);
      animation: scan-line 6s linear infinite;
      pointer-events: none;
      z-index: 2;
      top: 0;
    }

    @keyframes scan-line {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="overlay-container" id="overlayContainer">
    <!-- Corner Brackets -->
    <div class="corner-bracket tl"></div>
    <div class="corner-bracket tr"></div>
    <div class="corner-bracket bl"></div>
    <div class="corner-bracket br"></div>

    <!-- Scan Line -->
    <div class="scan-line"></div>

    <!-- Header -->
    <div class="overlay-header">
      <span class="overlay-title">
        ARIA
      </span>
      <span class="overlay-close" id="closeOverlay" title="Close overlay">&times;</span>
    </div>

    <!-- Chat Messages -->
    <div class="chat-area">
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty" id="chatEmpty">
          <div class="icon">◉</div>
          <div>ARIA Assistant</div>
          <div style="font-size: 9px; opacity: 0.6;">Type or speak a command</div>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" class="input-field" id="inputField" placeholder="Ask ARIA anything..." autocomplete="off" />
        <button class="send-btn" id="sendBtn" title="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span class="status-text">
        <span class="dot"></span>
        <span id="statusText">Connected</span>
      </span>
      <span id="overlayTimestamp">--:--:--</span>
    </div>
  </div>

  <script>
    const ipc = window.require('electron').ipcRenderer;
    const overlay = document.getElementById('overlayContainer');
    const closeBtn = document.getElementById('closeOverlay');
    const chatMessages = document.getElementById('chatMessages');
    const chatEmpty = document.getElementById('chatEmpty');
    const inputField = document.getElementById('inputField');
    const sendBtn = document.getElementById('sendBtn');
    const statusText = document.getElementById('statusText');
    const timestampEl = document.getElementById('overlayTimestamp');

    // Update timestamp every second
    function updateTimestamp() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      timestampEl.textContent = h + ':' + m + ':' + s;
    }
    updateTimestamp();
    setInterval(updateTimestamp, 1000);

    // Add a message to the chat
    function addMessage(text, sender) {
      // Remove empty state
      if (chatEmpty && chatEmpty.parentNode) {
        chatEmpty.remove();
      }

      const msg = document.createElement('div');
      msg.className = 'chat-msg ' + sender;

      if (sender === 'aria') {
        msg.innerHTML = '<div class="sender">ARIA</div><div class="text"></div>';
        msg.querySelector('.text').textContent = text;
      } else if (sender === 'user') {
        msg.innerHTML = '<div class="sender">You</div><div class="text"></div>';
        msg.querySelector('.text').textContent = text;
      } else if (sender === 'thinking') {
        msg.innerHTML = '<div class="text">Processing<span class="dots"><span></span><span></span><span></span></span></div>';
      }

      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return msg;
    }

    // Send message to ARIA
    async function sendMessage() {
      const text = inputField.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      inputField.value = '';

      // Show thinking indicator
      const thinkingMsg = addMessage('', 'thinking');

      // Send to ARIA via IPC
      await ipc.invoke('overlay:send-message', { text: text });
    }

    // Handle response from ARIA
    ipc.on('overlay:response', (event, data) => {
      // Remove thinking indicator
      const thinking = chatMessages.querySelector('.chat-msg.thinking');
      if (thinking) thinking.remove();

      if (data && data.text) {
        addMessage(data.text, 'aria');
      }
    });

    // Send button click
    sendBtn.addEventListener('click', sendMessage);

    // Enter key to send
    inputField.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Close button handler
    closeBtn.addEventListener('click', async () => {
      await ipc.invoke('screen:toggle-overlay', false);
    });

    // Notify main process that overlay is ready
    await ipc.invoke('screen:toggle-overlay', true);

    // Focus input on load
    setTimeout(() => inputField.focus(), 300);
  </script>
</body>
</html>
