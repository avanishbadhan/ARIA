<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00f0ff;
      --primary-glow: rgba(0, 240, 255, 0.4);
      --bg-dark: #050914;
      --panel-bg: rgba(10, 16, 30, 0.95);
      --panel-solid: #0a101e;
      --border-color: rgba(0, 243, 255, 0.3);
      --text-main: #e8eefc;
      --text-dim: #8b98b8;
      --font-mono: 'Roboto Mono', 'Consolas', monospace;
      --font-main: 'Segoe UI', 'Inter', 'Roboto', sans-serif;
      --radius: 14px;
      --green-ok: #34d399;
      --gold-glow: #ffaa00;
      --red-alert: #ff3366;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: var(--font-main);
      color: var(--text-main);
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ===== Closed State: Tiny Overlay Box ===== */
    .overlay-panel {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 56px;
      height: 56px;
      background: rgba(10, 16, 30, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 0 30px rgba(0, 240, 255, 0.15),
        0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 2147483647;
      line-height: 1.4;
      pointer-events: auto;
      opacity: 1;
      transform: scale(1);
      animation: panel-enter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: move;
      -webkit-app-region: drag;
      transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                  height 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-radius 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Hover state - expand to chat panel */
    .overlay-panel:hover {
      width: 380px;
      height: 520px;
      border-radius: 16px;
      padding: 16px;
      overflow-y: auto;
      cursor: default;
    }

    /* ===== ARIA Logo (Closed State) ===== */
    .aria-logo-large {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--primary);
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
      line-height: 1;
      margin-bottom: 4px;
    }

    .overlay-panel:hover .aria-logo-large {
      opacity: 0;
      pointer-events: none;
    }

    /* ===== Title Bar (Hidden When Closed) ===== */
    .title-bar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px 6px;
      background: rgba(0, 240, 255, 0.03);
      border-bottom: 1px solid rgba(0, 240, 255, 0.08);
      -webkit-app-region: drag;
      cursor: grab;
      flex-shrink: 0;
      user-select: none;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .overlay-panel:hover .title-bar {
      opacity: 1;
      transform: translateY(0);
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .aria-logo-small {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: linear-gradient(135deg, #00f0ff 0%, #0080ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 700;
      color: #050914;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }

    .title-text {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--primary);
      text-shadow: 0 0 6px rgba(0, 240, 255, 0.3);
    }

    .title-actions {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .action-btn {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      font-size: 14px;
      pointer-events: auto;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
    }

    .action-btn.close:hover {
      background: rgba(255, 51, 102, 0.15);
      color: var(--red-alert);
    }

    /* ===== Hidden UI Elements (Hidden When Closed) ===== */
    .hidden-when-closed {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .overlay-panel:hover .hidden-when-closed {
      opacity: 1;
      pointer-events: auto;
    }

    /* ===== Chat Area ===== */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 0 16px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: thin;
    }

    .chat-messages::-webkit-scrollbar {
      width: 3px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.15);
      border-radius: 2px;
    }

    .chat-msg {
      max-width: 92%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      line-height: 1.45;
      word-wrap: break-word;
      animation: msg-enter 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes msg-enter {
      0% { opacity: 0; transform: translateY(6px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .chat-msg.user {
      align-self: flex-end;
      background: rgba(0, 240, 255, 0.07);
      border: 1px solid rgba(0, 240, 255, 0.15);
      color: var(--text-main);
      border-bottom-right-radius: 3px;
    }

    .chat-msg.aria {
      align-self: flex-start;
      background: rgba(13, 22, 41, 0.55);
      border: 1px solid rgba(148, 184, 255, 0.1);
      color: var(--text-main);
      border-bottom-left-radius: 3px;
    }

    .chat-msg.aria .sender {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .chat-msg.aria .sender::before {
      content: '';
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 4px var(--primary-glow);
    }

    .chat-msg.user .sender {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 3px;
      text-align: right;
    }

    .chat-msg.thinking {
      align-self: flex-start;
      background: rgba(13, 22, 41, 0.45);
      border: 1px solid rgba(148, 184, 255, 0.08);
      color: var(--text-dim);
      font-style: italic;
      font-size: 11.5px;
      border-bottom-left-radius: 3px;
    }

    .chat-msg.thinking .dots {
      display: inline-flex;
      gap: 2px;
      margin-left: 4px;
    }

    .chat-msg.thinking .dots span {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--primary);
      animation: thinking-dot 1.2s ease-in-out infinite;
    }

    .chat-msg.thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
    .chat-msg.thinking .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes thinking-dot {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      opacity: 0.5;
      gap: 5px;
    }

    .chat-empty .icon {
      font-size: 18px;
      opacity: 0.5;
      margin-bottom: 5px;
    }

    /* ===== Input Area ===== */
    .input-area {
      padding: 6px 12px 10px;
      border-top: 1px solid rgba(148, 184, 255, 0.08);
      flex-shrink: 0;
      background: rgba(5, 9, 20, 0.3);
    }

    .input-wrapper {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .input-field {
      flex: 1;
      background: rgba(13, 22, 41, 0.6);
      border: 1px solid rgba(148, 184, 255, 0.1);
      border-radius: 8px;
      padding: 7px 12px;
      color: var(--text-main);
      font-family: var(--font-main);
      font-size: 12px;
      outline: none;
      transition: all 0.2s ease;
      pointer-events: auto;
    }

    .input-field::placeholder {
      color: var(--text-dim);
      opacity: 0.55;
    }

    .input-field:focus {
      border-color: rgba(0, 240, 255, 0.35);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.08);
    }

    .send-btn {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid rgba(0, 240, 255, 0.15);
      background: rgba(0, 240, 255, 0.05);
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      pointer-events: auto;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
    }

    .send-btn:active {
      transform: scale(0.94);
    }

    .send-btn svg {
      width: 13px;
      height: 13px;
    }

    /* ===== Status Bar ===== */
    .status-bar {
      padding: 4px 12px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 7.5px;
      color: var(--text-dim);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      opacity: 0.5;
      flex-shrink: 0;
    }

    .status-bar .dot {
      display: inline-block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--primary);
      margin-right: 3px;
      vertical-align: middle;
      box-shadow: 0 0 3px var(--primary-glow);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    /* ===== Scan Line ===== */
    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.2), transparent);
      animation: scan-line 8s linear infinite;
      pointer-events: none;
      z-index: 2;
      top: 0;
    }

    @keyframes scan-line {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div class="overlay-panel" id="overlayPanel">
    <!-- Scan Line -->
    <div class="scan-line"></div>

    <!-- ARIA Logo Only (Closed State) -->
    <div class="aria-logo-large">ARIA</div>

    <!-- Title Bar (Hidden When Closed) -->
    <div class="title-bar hidden-when-closed">
      <div class="title-left">
        <div class="aria-logo-small">A</div>
        <span class="title-text">ARIA</span>
      </div>
      <div class="title-actions hidden-when-closed">
        <button class="action-btn close" id="closeBtn" title="Close overlay">&times;</button>
      </div>
    </div>

    <!-- Chat Messages (Hidden When Closed) -->
    <div class="chat-area hidden-when-closed">
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty" id="chatEmpty">
          <div class="icon">◉</div>
          <div>ARIA</div>
          <div style="font-size: 9px; opacity: 0.6;">Type a command</div>
        </div>
      </div>
    </div>

    <!-- Input Area (Hidden When Closed) -->
    <div class="input-area hidden-when-closed">
      <div class="input-wrapper">
        <input type="text" class="input-field" id="inputField" placeholder="Ask ARIA..." autocomplete="off" />
        <button class="send-btn" id="sendBtn" title="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

    <!-- Status Bar (Hidden When Closed) -->
    <div class="status-bar hidden-when-closed">
      <span class="status-text">
        <span class="dot"></span>
        <span id="statusText">Connected</span>
      </span>
      <span id="overlayTimestamp">--:--:--</span>
    </div>
  </div>

  <script>
    (async () => {
      const ipc = window.jarvisElectron?.ipcRenderer;
      const overlayPanel = document.getElementById('overlayPanel');
      const closeBtn = document.getElementById('closeBtn');
      const chatMessages = document.getElementById('chatMessages');
      const chatEmpty = document.getElementById('chatEmpty');
      const inputField = document.getElementById('inputField');
      const sendBtn = document.getElementById('sendBtn');
      const timestampEl = document.getElementById('overlayTimestamp');

      // Update timestamp every second
      function updateTimestamp() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        timestampEl.textContent = h + ':' + m + ':' + s;
      }
      updateTimestamp();
      setInterval(updateTimestamp, 1000);

      // Add a message to the chat
      function addMessage(text, sender) {
        if (chatEmpty && chatEmpty.parentNode) chatEmpty.remove();
        const msg = document.createElement('div');
        msg.className = 'chat-msg ' + sender;
        if (sender === 'aria') {
          msg.innerHTML = '<div class="sender">ARIA</div><div class="text"></div>';
          msg.querySelector('.text').textContent = text;
        } else if (sender === 'user') {
          msg.innerHTML = '<div class="sender">You</div><div class="text"></div>';
          msg.querySelector('.text').textContent = text;
        } else if (sender === 'thinking') {
          msg.innerHTML = '<div class="text">Processing<span class="dots"><span></span><span></span><span></span></span></div>';
        }
        chatMessages.appendChild(msg);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return msg;
      }

      // Send message to ARIA
      async function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;
        addMessage(text, 'user');
        inputField.value = '';
        const thinkingMsg = addMessage('', 'thinking');
        try {
          await ipc.invoke('overlay:send-message', { text: text });
        } catch (e) {
          const t = chatMessages.querySelector('.chat-msg.thinking');
          if (t) t.remove();
          addMessage('Error: ' + e.message, 'aria');
        }
      }

      // Handle response from ARIA
      ipc.on('overlay:response', (event, data) => {
        const t = chatMessages.querySelector('.chat-msg.thinking');
        if (t) t.remove();
        if (data && data.text) addMessage(data.text, 'aria');
      });

      // Send button click
      sendBtn.addEventListener('click', sendMessage);

      // Enter key to send
      inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Close button handler
      closeBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        e.preventDefault();
        await ipc.invoke('screen:toggle-overlay', false);
      });

      // Notify main process that overlay is ready
      await ipc.invoke('overlay:toggle-ready');

      // Focus input on load
      setTimeout(() => inputField.focus(), 300);

      // Handle hover expand/collapse via IPC
      overlayPanel.addEventListener('mouseenter', async () => {
        await ipc.invoke('overlay:resize', { width: 380, height: 520 });
      });

      overlayPanel.addEventListener('mouseleave', async () => {
        await ipc.invoke('overlay:resize', { width: 56, height: 56 });
      });
    })();
</script>
</body>
</html>
