<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Autonomous AI Engine</title>
    <!-- Include Mermaid.js for Dynamic Diagram Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <!-- Include TensorFlow.js & COCO-SSD for Real-Time Object Bounding Box Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
</head>
<body>

    <div id="hud-container">
        <!-- Header Controls -->
        <div id="hud-header">
            <div class="hud-title">
                <div class="hud-status-badge"></div>
                <strong>J.A.R.V.I.S. HUD v10.0 (VISION & BOUNDING BOX ENGINE)</strong>
            </div>
            <div class="header-actions">
                <select id="voice-select" class="api-input-box" style="width: 180px;"></select>
                <input type="password" id="api-key" class="api-input-box" placeholder="Gemini API Key">
                <button class="btn-toggle" id="btn-camera-toggle">CAM</button>
                <button class="btn-toggle" id="btn-drawer-toggle">LOGS</button>
                <button class="btn-toggle" id="power-btn">INITIALIZE</button>
            </div>
        </div>

        <!-- Main Viewport Stage -->
        <div id="central-stage">
            <!-- Camera Display Window -->
            <div id="camera-panel">
                <div id="camera-header">
                    <span>📹 OPTICAL FEED</span>
                    <button class="widget-btn" id="btn-camera-close">✕</button>
                </div>
                <div class="camera-viewport">
                    <video id="camera-video" autoplay playsinline muted></video>
                    <canvas id="camera-overlay-canvas"></canvas>
                </div>
            </div>

            <!-- Left Utilities Dock -->
            <div id="widget-dock"></div>

            <!-- Central Arc Reactor Focus -->
            <div id="reactor-wrapper">
                <div id="reactor-target">
                    <div class="ring outer"></div>
                    <div class="ring middle"></div>
                    <div class="ring inner"></div>
                    <div class="ring core" id="reactor-core"></div>
                </div>

                <div id="audio-waveform">
                    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                    <div class="wave-bar"></div><div class="wave-bar"></div>
                </div>

                <div id="status-display">SYSTEM OFFLINE — INITIALIZE TO START</div>
            </div>

            <!-- Holographic Visual Canvas Overlay (Full Stage Focus) -->
            <div id="visual-display-panel">
                <div id="visual-content"></div>
                <div id="visual-subtitle"></div>
                <button class="widget-btn" id="btn-visual-close" style="position: absolute; top: 14px; right: 14px; font-size: 11px; padding: 6px 12px;">✕ CLOSE</button>
            </div>

            <!-- Centered Response Overlay Display -->
            <div id="central-response-overlay"></div>
        </div>

        <!-- Slide-out Side Console History -->
        <div id="chat-drawer">
            <div class="drawer-header">
                <span>CONVERSATION LOGS</span>
                <button class="widget-btn" id="btn-drawer-close">✕ CLOSE</button>
            </div>
            <div id="console-log">
                <div class="log-entry jarvis-log">> System initialized with multi-model fallback chain & real-time bounding box tracking.</div>
            </div>
        </div>

        <!-- Direct Directives Input Bar -->
        <div class="controls-bar">
            <input type="text" id="manual-cmd" class="text-cmd-input" placeholder="Type a directive, e.g., 'What am I holding?' or 'Open camera'">
            <button class="btn-toggle" id="btn-send-command">EXECUTE</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
